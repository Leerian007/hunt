<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hunt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hunt</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #212121; color: #d5bc86; font-family: sans-serif; }
    #boot { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    #boot p { color: #adbac1; }
    #boot button { background: #233039; color: #d5bc86; border: 1px solid #46505a; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="boot" role="status">
    <h1>HUNT 1896</h1>
    <p id="boot-message">正在加载猎人档案…</p>
    <button id="boot-retry" hidden onclick="location.reload()">重新加载</button>
  </div>
  <script>
    window.showBootError = function() {
      const message = document.getElementById('boot-message');
      if (!message) return;
      message.textContent = '页面资源加载失败，请检查网络后重试。';
      document.getElementById('boot-retry').hidden = false;
    };
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('boot')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="showBootError()"></script>
</body>
</html>
